<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>書きトレ - 漢字書き取りれんしゅう</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=M+PLUS+Rounded+1c:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- 分割したスタイルシートの並列読み込み -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/practice.css">
  <link rel="stylesheet" href="css/result.css">
</head>
<body>

  <!-- ==================== ログインモーダル ==================== -->
  <div id="login-modal" class="login-modal-overlay">
    <div class="login-card">
      <div class="login-logo-container">
        <img src="assets/images/logo_01.png" alt="書きトレ 小学生の漢字練習アプリ" class="login-logo-img">
      </div>

      <div class="login-section">
        <label for="select-class" class="login-label">① クラス</label>
        <select id="select-class" class="custom-select">
          <option value="">よみこみ中...</option>
        </select>
      </div>

      <div class="login-section">
        <label for="select-user" class="login-label">② なまえ</label>
        <select id="select-user" class="custom-select" disabled>
          <option value="">なまえを えらんでね</option>
        </select>
      </div>

      <div class="login-section">
        <label for="input-pin" class="login-label">③ パスワード（すうじ４けた）</label>
        <input type="password" id="input-pin" class="custom-input" inputmode="numeric" maxlength="4" placeholder="例: 1234">
      </div>

      <div id="login-error-msg" class="login-error-msg" style="display: none;"></div>

      <button type="button" id="btn-submit-login" class="btn-login-submit" disabled>ログインする</button>
    </div>
  </div>

  <!-- ==================== きき手設定モーダル ==================== -->
  <div id="hand-modal" class="login-modal-overlay" style="display: none;">
    <div class="login-card small-modal-card">
      <h2 class="modal-sub-title">どちらの手で 書く？</h2>
      <p class="modal-sub-desc">あとから いつでも かえられるよ！</p>
      
      <div class="hand-modal-selector">
        <button type="button" class="btn-hand-choice" data-hand="left">
          <span class="hand-choice-icon">🤚</span>
          <span class="hand-choice-text">ひだりきき</span>
        </button>
        <button type="button" class="btn-hand-choice" data-hand="right">
          <span class="hand-choice-icon">✋</span>
          <span class="hand-choice-text">みぎきき</span>
        </button>
      </div>
      <button type="button" id="btn-close-hand-modal" class="btn-modal-cancel" style="display: none;">とじる</button>
    </div>
  </div>

  <!-- ==================== パスワード変更モーダル ==================== -->
  <div id="pin-modal" class="login-modal-overlay" style="display: none;">
    <div class="login-card small-modal-card">
      <h2 class="modal-sub-title">🔑 パスワードを かえる</h2>
      <p class="modal-sub-desc">あたらしい すうじ４けたを いれてね</p>

      <div class="login-section">
        <input type="password" id="input-new-pin" class="custom-input" inputmode="numeric" maxlength="4" placeholder="新しい4けた">
      </div>
      <div id="pin-modal-msg" class="login-error-msg" style="display: none;"></div>

      <div class="modal-btn-row">
        <button type="button" id="btn-cancel-pin" class="btn-modal-cancel">キャンセル</button>
        <button type="button" id="btn-save-pin" class="btn-login-submit" style="margin-top: 0; padding: 8px 18px;" disabled>保存する</button>
      </div>
    </div>
  </div>

  <!-- ==================== メニュー（スタート）画面 ==================== -->
  <div id="menu-view" class="menu-view">
    <div class="menu-card">
      
      <div class="menu-header-row">
        <div class="menu-logo-container">
          <img src="assets/images/logo_01.png" alt="書きトレ" class="menu-logo-img">
        </div>

        <div id="user-info-bar" class="user-info-bar" style="display: none;">
          <div class="user-welcome">👤 <span id="user-display-name">---</span> さん</div>
          <div class="user-actions-group">
            <button type="button" id="btn-open-hand-modal" class="btn-user-action" title="きき手を変更">🤚 きき手</button>
            <button type="button" id="btn-open-pin-modal" class="btn-user-action" title="パスワードを変更">🔑 パスワード</button>
            <button type="button" id="btn-logout" class="btn-user-action btn-action-logout">ログアウト</button>
          </div>
        </div>
      </div>
      
      <div class="menu-section">
        <label class="menu-label">1. どの がくねんの かんじ？</label>
        <select id="select-grade" class="custom-select">
          <option value="5" selected>小学5年生</option>
        </select>
      </div>

      <div class="menu-section">
        <label class="menu-label">2. もんだいを えらぶ</label>
        
        <div class="term-tabs">
          <button type="button" class="term-tab active" data-term="1">1学期</button>
          <button type="button" class="term-tab" data-term="2">2学期</button>
          <button type="button" class="term-tab term-tab-disabled" disabled title="準備中です">3学期 (準備中)</button>
        </div>

        <div id="set-grid-container" class="set-grid-container"></div>
      </div>

      <button id="btn-start" class="btn-start">書き取りにチャレンジ！</button>
    </div>
  </div>

  <!-- ==================== 練習アプリ画面 ==================== -->
  <div id="practice-view" class="app-layout" style="display: none;">
    <!-- 左カラム（問題ペイン） -->
    <aside class="problem-pane">
      <div class="header-section">
        <div class="header-top-row">
          <img src="assets/images/logo_01.png" alt="書きトレ" class="practice-header-logo">
          <button id="btn-back-menu" class="btn-back-menu" title="メニューに戻る">もどる</button>
        </div>
        <div class="unit-title" id="unit-title-display">1学期 その1</div>
        <div class="progress-bar" id="progress-text">もんだい 1 / 5</div>
      </div>

      <div class="question-card">
        <div id="question-notice" class="question-notice" style="display: none;"></div>
        <div class="question-sentence" id="question-text"></div>
      </div>

      <div class="mascot-feedback-container">
<div class="mascot-avatar-box">
  <img id="mascot-img" src="assets/images/kakimaru_01.png" alt="かきまる" class="mascot-img">
</div>
        <div class="speech-bubble">
          <div id="status-message" class="status-msg">1文字目を書いてね</div>
        </div>
      </div>
    </aside>

<!-- 右カラム -->
    <main class="canvas-pane">
      <!-- 判定結果画面（上下比較カード） -->
      <div class="result-comparison-area" id="result-comparison-area" style="display: none;">
        <div class="cards-column">
          <div class="compare-card user-card">
            <div class="user-title">あなたの こたえ</div>
            <div class="user-canvases-container" id="user-canvases-container"></div>
          </div>

          <div class="compare-card correct-card">
            <div class="correct-title" id="correct-card-title">せいかいの おてほん</div>
            <div class="correct-chars-container" id="correct-chars-container"></div>
            <!-- お手本文字の下に配置する案内文 -->
            <div id="correct-hint-text" class="correct-hint-text" style="display: none;">
              タッチすると かきじゅんが みられるよ。
            </div>
          </div>

        <div id="result-label" class="result-label"></div>
        <button id="btn-restart-all" class="btn-restart-all">もういちど</button>
      </div>

      <!-- 手書き描画メインエリア -->
      <div class="drawing-main-area" id="drawing-container">
        <div class="char-tabs" id="char-tabs"></div>

        <div class="canvas-row-wrapper">
          <button id="btn-undo" class="btn-history" title="1かくもどる (Ctrl+Z)" disabled>1かくもどる</button>
          <div class="box">
            <canvas id="draw-canvas" width="260" height="260"></canvas>
          </div>
          <button id="btn-redo" class="btn-history" title="1かくすすむ (Ctrl+Y)" disabled>1かくすすむ</button>
        </div>

        <!-- 2行表記の画数パネル -->
        <div class="info-panel" id="stroke-info">
          <div id="target-stroke-info" class="stroke-info-line">このじは ０かく です。</div>
          <div id="current-stroke-info" class="stroke-info-line">いまの かくすう：０かく</div>
        </div>

        <!-- 描画操作ボタン -->
        <div class="controls">
          <button id="btn-prev" class="btn-prev" disabled>まえのもじへ</button>
          <button id="btn-reset" class="btn-reset" disabled>かきなおす</button>
          <button id="btn-next" class="btn-next">つぎのもじへ</button>
        </div>

        <!-- プレビュー ＆ 「こたえあわせ」「パス」ボタン -->
        <div class="bottom-action-panel">
          <div class="realtime-preview-row">
            <span class="realtime-preview-label">かいたもじ</span>
            <div id="realtime-preview-container" class="realtime-preview-container"></div>
          </div>
          <div class="submit-action-row">
            <button id="btn-check" class="btn-check-main" disabled>こたえあわせ</button>
            <button id="btn-pass" class="btn-pass-sub">パス</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- ==================== 全問クリア画面（1画面フルスクリーン） ==================== -->
  <div id="all-clear-view" class="all-clear-view" style="display: none;">
    <div class="all-clear-card">
      <div class="clear-badge">💮</div>
      <div class="clear-title">はなまる満点！</div>

      <!-- マスコットが賞賛の言葉を発話 -->
<div class="clear-mascot-row">
  <div class="mascot-avatar-box clear-mascot-avatar">
    <img id="clear-mascot-img" src="assets/images/kakimaru_05.png" alt="かきまる" class="mascot-img">
  </div>
  <div class="speech-bubble clear-speech-bubble">
    <div class="status-msg clear-status-msg">
      全5問クリア！さいごまで よくがんばったね！
    </div>
  </div>
</div>

      <div class="clear-actions">
        <button id="btn-clear-retry" class="btn-clear-action">もう一度この問題をとく</button>
        <button id="btn-clear-next" class="btn-clear-action btn-next-set">つぎの回にすすむ</button>
        <button id="btn-clear-menu" class="btn-clear-action btn-back-home">メニューにもどる</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
